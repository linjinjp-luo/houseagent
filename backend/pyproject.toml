[project]
name = "houseagent"
version = "1.0.0"
description = "HouseAgent 1.0 - Windows local property search and management workbench"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["houseagent*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
packages = ["houseagent"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
